<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout · Example Shop</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <form id="pay">
      <label>
        Card number
        <input name="cardnumber" autocomplete="cc-number" inputmode="numeric" />
      </label>
      <label>
        CVV
        <input name="cvv" autocomplete="cc-csc" inputmode="numeric" />
      </label>
      <button type="submit">Pay now</button>
    </form>
  </body>
</html>
